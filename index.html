<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f6ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Casa em Dia" />
  <link rel="icon" href="./icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Casa em Dia</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f6ff;
      color: #172033;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at 50% 35%, rgba(255, 255, 255, .95), transparent 55%),
        linear-gradient(160deg, #f6f8ff 0%, #eaf1ff 100%);
    }
    main {
      width: min(100%, 340px);
      text-align: center;
      animation: arrive .5s ease both;
    }
    .mark {
      width: 88px;
      height: 88px;
      margin: 0 auto 26px;
      display: grid;
      place-items: center;
      border-radius: 26px;
      background: linear-gradient(145deg, #2788ff, #0064e8);
      box-shadow: 0 14px 34px rgba(0, 100, 232, .25), inset 0 1px 0 rgba(255,255,255,.4);
    }
    .mark img { width: 74px; height: 74px; object-fit: contain; }
    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: -.7px;
      font-weight: 750;
    }
    .tagline {
      margin: 9px 0 30px;
      color: #66738d;
      font-size: 14px;
      line-height: 1.5;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #50617d;
      font-size: 13px;
      font-weight: 550;
    }
    .spinner {
      width: 17px;
      height: 17px;
      border: 2px solid #cbd9f3;
      border-top-color: #0878f9;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .track {
      height: 3px;
      overflow: hidden;
      margin: 18px auto 0;
      border-radius: 99px;
      background: rgba(58, 111, 190, .12);
    }
    .track::after {
      content: "";
      display: block;
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #1580ff, transparent);
      animation: progress 1.5s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes progress { from { transform: translateX(-110%); } to { transform: translateX(290%); } }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
    @media (prefers-color-scheme: dark) {
      :root { background: #101722; color: #f4f7ff; }
      body { background: radial-gradient(ellipse at 50% 35%, #1d2b41, transparent 58%), linear-gradient(160deg, #111a28, #0b111b); }
      .tagline { color: #a7b5cd; }
      .loading { color: #c2cee1; }
      .spinner { border-color: #33445e; border-top-color: #53a1ff; }
      .track { background: rgba(160, 190, 235, .15); }
    }
  </style>
</head>
<body>
  <main aria-live="polite" aria-busy="true">
    <div class="mark" aria-hidden="true"><img src="./icon-192.png" alt="" /></div>
    <h1>Casa em Dia</h1>
    <p class="tagline">Suas finanças da casa, organizadas em um só lugar.</p>
    <div class="loading"><span class="spinner" aria-hidden="true"></span><span>Abrindo seu espaço...</span></div>
    <div class="track" aria-hidden="true"></div>
    <noscript><p><a href="./casa-em-dia-prototype.html">Continuar para o Casa em Dia</a></p></noscript>
  </main>
  <script>
    const appUrl = new URL('./casa-em-dia-prototype.html', window.location.href);
    appUrl.search = window.location.search;
    appUrl.hash = window.location.hash;
    window.location.replace(appUrl.href);
  </script>
</body>
</html>
